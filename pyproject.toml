[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-dashboard"
version = "1.0.0"
description = "Wall-mounted home dashboard: Ryuk assistant summaries on an iPad."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "websockets>=13.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "bandit==1.9.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "TRY004"]

[tool.mypy]
python_version = "3.11"
files = ["app", "scripts", "tests"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
