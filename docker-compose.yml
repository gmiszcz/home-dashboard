services:
  dashboard:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      DB_PATH: /data/dashboard.sqlite
      HOST: 0.0.0.0
    volumes:
      - dashboard-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  dashboard-data:
