services:
  dashboard:
    # Keep this name in sync with IMAGE_REPO in scripts/auto-update.sh.
    # No build key here: the Pi must not compile. Laptop builds add
    # docker-compose.dev.yml (`just docker`), which Compose does not load
    # on its own.
    image: ghcr.io/gmiszcz/home-dashboard:${DASHBOARD_TAG:-latest}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      DB_PATH: /data/dashboard.sqlite
      HOST: 0.0.0.0
    volumes:
      - dashboard-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  dashboard-data:
